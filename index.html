.scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),transparent 25%,transparent 70%,rgba(0,0,10,.35))}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:.9}}
.lan{position:absolute;bottom:-15vh;left:var(--x);animation:rise var(--d) linear infinite;animation-delay:var(--dl);z-index:1}
.lan i{display:block;width:var(--s);height:calc(var(--s)*1.3);border-radius:42% 42% 16% 16%/32% 32% 12% 12%;position:relative;
 background:radial-gradient(circle at 50% 78%,#fff3b8 0,#ffbe55 45%,#e0701e 100%);box-shadow:0 0 calc(var(--s)*.9) rgba(255,170,60,.55);animation:sway 4s ease-in-out infinite alternate}
.lan i::before{content:"";position:absolute;left:12%;right:12%;top:0;height:7%;background:#8a3a12;border-radius:50%}
@keyframes rise{0%{transform:translateY(0);opacity:0}8%{opacity:1}85%{opacity:.9}100%{transform:translateY(-135vh);opacity:0}}
@keyframes sway{from{transform:translateX(-12px) rotate(-4deg)}to{transform:translateX(12px) rotate(4deg)}}

/* กระทง (ภาพที่แนบ) */
.kt{position:absolute;left:var(--l);bottom:var(--b);width:calc(var(--s)*clamp(70px,21vw,150px));z-index:3;animation:drift var(--d) ease-in-out infinite alternate;animation-delay:var(--dl)}
.kt img{display:block;width:100%;height:auto;animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 0 16px rgba(255,190,90,.6));pointer-events:none}
@keyframes drift{from{transform:translateX(calc(var(--a)*-1))}to{transform:translateX(var(--a))}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2.5deg)}50%{transform:translateY(-5px) rotate(2.5deg)}}
.shimmer{position:absolute;left:0;right:0;bottom:0;height:16vh;z-index:2;pointer-events:none;
 background:repeating-linear-gradient(180deg,rgba(255,200,120,.10) 0 2px,transparent 2px 12px);background-size:100% 12px;animation:rip 6s linear infinite}
@keyframes rip{to{background-position:0 24px}}

main{position:relative;z-index:5}
.hero{min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:9vh 1.25rem 0;text-align:center}
h1{font-family:var(--head);font-weight:400;font-size:clamp(2.6rem,11.5vw,5rem);line-height:1.2;margin:0;
 background:linear-gradient(180deg,#fff7d6 10%,var(--gold) 55%,#d99a3d 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 14px rgba(0,0,0,.8))}
.hero p{max-width:26em;margin:.6rem 0 1.4rem;font-size:clamp(1.15rem,4.4vw,1.45rem);color:#fff0d0;text-shadow:0 1px 10px #000,0 0 22px #000}
.go{display:inline-flex;align-items:center;justify-content:center;min-height:58px;padding:0 2.4rem;border-radius:999px;background:var(--amber);color:#3a1a05;font-weight:600;font-size:1.3rem;text-decoration:none;box-shadow:0 0 30px rgba(255,179,71,.6)}
.go:active{transform:scale(.97)}
.go:focus-visible,.alt:focus-visible{outline:3px solid #fff;outline-offset:3px}

.formwrap{padding:0 .6rem 14vh}
.card{width:min(800px,100%);margin:0 auto;border-radius:24px;overflow:hidden;background:rgba(8,6,30,.9);
 border:1px solid rgba(246,217,143,.4);box-shadow:0 20px 70px rgba(0,0,0,.6)}
.band{position:relative;height:120px;overflow:hidden;background:linear-gradient(180deg,#1a2350,#0a1330 70%,#060b1e);border-bottom:1px solid rgba(246,217,143,.3)}
.band::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(255,220,150,.10) 0 2px,transparent 2px 12px);background-size:100% 12px;animation:rip 6s linear infinite}
.band .kt{width:calc(var(--s)*clamp(58px,17vw,96px))}
.inner{padding:1.2rem 1rem 1.4rem}
.card h2{font-family:var(--head);font-weight:400;font-size:clamp(1.7rem,6.5vw,2.1rem);margin:0 0 .2rem;color:var(--gold)}
.card .sub{margin:0 0 1rem;font-size:1.05rem;color:#ecdfc2}
iframe{display:block;width:100%;height:1500px;border:0;border-radius:14px;background:#fff}
.alt{display:flex;align-items:center;justify-content:center;min-height:54px;margin-top:1rem;border:2px solid var(--gold);border-radius:999px;color:var(--gold);font-size:1.1rem;text-decoration:none}
@media (min-width:700px){iframe{height:1150px}.inner{padding:1.6rem 1.6rem 1.8rem}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important}.lan{display:none}}
</style>
</head>
